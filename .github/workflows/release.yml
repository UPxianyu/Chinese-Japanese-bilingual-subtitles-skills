name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=concert-bilingual-subtitles/ \
            --output="dist/concert-bilingual-subtitles-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
